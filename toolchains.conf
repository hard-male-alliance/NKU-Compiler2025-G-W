# Linux libc is required by sylib and the qemu-riscv64 user-mode test runner.
# Bare-metal unknown-elf tools need a separate compatible C library/sysroot.
RISCV_GCC=riscv64-linux-gnu-gcc
RISCV_AR=riscv64-linux-gnu-ar

# Stay within the Linux startup objects' medlow range and above ELF notes.
TEXT_ADDR=0x20000
